<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeedCurrency – Fast Free Currency Converter</title>
<meta name="description" content="Convert 160+ world currencies instantly. Free, fast, no sign-up.">
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#10222e;--mute:#5b6b76;--line:#d5dde3;--acc:#0b7a75;--hi:#ffc83d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0c1820;--card:#13242e;--ink:#e8f0f4;--mute:#93a5b0;--line:#25394590;--acc:#3cc4bb;--hi:#ffc83d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main,footer{max-width:960px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:18px;padding-bottom:6px}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none}.logo b{background:var(--hi);color:#10222e;padding:0 6px;border-radius:4px;margin-right:2px}
nav a{color:var(--mute);text-decoration:none;margin-left:14px;font-size:.9rem}
.layout{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:860px){.layout{grid-template-columns:1fr 300px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{font-size:1.5rem;margin:18px 0 12px;letter-spacing:-.02em}
.row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.row{grid-template-columns:1fr auto 1fr;align-items:end}}
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:1.1rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
#amt{font-size:1.5rem;font-weight:700}
button.swap{font-size:1.3rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;width:46px;height:46px;cursor:pointer;justify-self:center}
.go{display:block;width:100%;margin-top:16px;font:inherit;font-size:1.15rem;font-weight:800;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}.go:active{transform:scale(.99)}.go:disabled{opacity:.6;cursor:wait}
.result{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.from{color:var(--mute)}
.big{font-size:clamp(2rem,8vw,3.2rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;word-break:break-all}
.big span{color:var(--acc)}
.meta{color:var(--mute);font-size:.85rem;margin-top:6px}
.ad{min-height:100px;margin:16px 0;display:flex;align-items:center;justify-content:center}
.side{display:none;min-height:600px}@media(min-width:860px){.side{display:block}}
#consent{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 16px;display:none;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.9rem;z-index:9}
#consent button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#consent .ok{background:var(--acc);color:#fff;border-color:var(--acc)}
footer{color:var(--mute);font-size:.8rem;padding-top:24px;padding-bottom:90px}footer a{color:var(--mute)}
</style>
</head>
<body>
<header><a class="logo" href="./"><b>Speed</b>Currency</a><nav><a href="about.html">About</a><a href="contact.html">Contact</a></nav></header>
<main>
<h1>Currency converter</h1>
<div class="layout">
<div>
<div class="card">
<form id="cv" autocomplete="off">
<div class="row one">
<div><label for="amt">Amount</label><input id="amt" type="text" inputmode="decimal" value="1"></div>
</div>
<div class="row" style="margin-top:12px">
<div><label for="from">From</label><select id="from"><option value="USD">USD – US Dollar</option></select></div>
<button type="button" class="swap" id="swap" aria-label="Swap currencies">⇄</button>
<div><label for="to">To</label><select id="to"><option value="EUR">EUR – Euro</option></select></div>
</div>
<button type="submit" class="go" id="go">Convert</button>
</form>
<div class="result" aria-live="polite">
<div class="from" id="fromTxt">&nbsp;</div>
<div class="big" id="out">…</div>
<div class="meta" id="meta">Loading rates…</div>
</div>
</div>
<div class="ad" id="ad1"></div>
</div>
<aside class="side" id="ad2"></aside>
</div>
</main>
<footer>
<p>Rates are for information only. SpeedCurrency is not responsible for any losses. Rates from the free <a href="https://github.com/fawazahmed0/exchange-api" rel="noopener">currency-api</a>.</p>
<p><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></p>
</footer>
<div id="consent" role="dialog" aria-label="Cookie consent"><span>We use cookies for ads. See our <a href="privacy.html">Privacy Policy</a>.</span><button class="ok" id="yes">Accept</button><button id="no">Decline</button></div>
<script>
const $=id=>document.getElementById(id);
const PUB='ca-pub-3155975488847083', SLOT1='1326876060', SLOT2='5046629226';
let R=null;
const POP=['USD','EUR','GBP','ZAR','NAD','BWP','CNY','JPY','INR','AUD','CAD','CHF','NGN','KES','AED'];
function name(c){try{return new Intl.DisplayNames(['en'],{type:'currency'}).of(c)}catch(e){return c}}
function fmt(n){const d=n>=1?2:6;return n.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:n>=1?2:0})}
function calc(){
  if(!R){$('meta').textContent='Rates are still loading – one moment…';return}
  const a=parseFloat(String($('amt').value).replace(/[\s,]/g,'')),f=$('from').value,t=$('to').value;
  if(isNaN(a)||!R.rates[f]||!R.rates[t]){$('out').textContent='—';$('fromTxt').innerHTML='&nbsp;';$('meta').textContent='Enter an amount and pick two currencies.';return}
  const rate=R.rates[t]/R.rates[f];
  $('fromTxt').textContent=fmt(a)+' '+f+' =';
  $('out').innerHTML=fmt(a*rate)+' <span>'+t+'</span>';
  $('meta').textContent='1 '+f+' = '+rate.toLocaleString(undefined,{maximumSignificantDigits:6})+' '+t+' · Rates dated '+R.updated;
  try{localStorage.setItem('sc',JSON.stringify({f,t}))}catch(e){}
}
$('cv').addEventListener('submit',e=>{e.preventDefault();calc()});
$('swap').onclick=()=>{const f=$('from').value;$('from').value=$('to').value;$('to').value=f;calc()};
$('amt').addEventListener('input',calc);
['from','to'].forEach(i=>$(i).addEventListener('change',calc));
function fill(rates,saved){
  const all=Object.keys(rates).sort(),pop=POP.filter(c=>rates[c]),rest=all.filter(c=>!pop.includes(c));
  const opt=c=>'<option value="'+c+'">'+c+' – '+name(c)+'</option>';
  const html='<optgroup label="Popular">'+pop.map(opt).join('')+'</optgroup><optgroup label="All currencies">'+rest.map(opt).join('')+'</optgroup>';
  $('from').innerHTML=html;$('to').innerHTML=html;
  $('from').value=rates[saved.f]?saved.f:'USD';$('to').value=rates[saved.t]?saved.t:'NAD';
}
function timeout(ms){return new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))}
const U=['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json','https://latest.currency-api.pages.dev/v1/currencies/usd.min.json','https://open.er-api.com/v6/latest/USD'];
async function load(){
  $('go').disabled=true;$('go').textContent='Loading rates…';
  let d=null;
  for(const u of U){
    try{const r=await Promise.race([fetch(u,{cache:'no-store'}),timeout(8000)]);if(!r.ok)continue;const j=await r.json();
      if(j.usd){d={rates:j.usd,date:j.date};break}
      if(j.rates){const o={};for(const k in j.rates)o[k.toLowerCase()]=j.rates[k];d={rates:o,date:(j.time_last_update_utc||'').slice(5,16)};break}
    }catch(e){}
  }
  $('go').disabled=false;$('go').textContent='Convert';
  if(!d){$('out').textContent='—';$('meta').innerHTML='Rates could not load. <a href="#" id="retry">Try again</a>';$('retry').onclick=e=>{e.preventDefault();load()};return}
  const rates={};
  for(const k in d.rates){const c=k.toUpperCase();if(c.length===3&&typeof d.rates[k]==='number'&&name(c)!==c)rates[c]=d.rates[k]}
  rates.USD=1;
  R={rates,updated:d.date};
  let saved={};try{saved=JSON.parse(localStorage.getItem('sc')||'{}')}catch(e){}
  fill(rates,saved);calc();
}
load();
// Ads load only after consent
function loadAds(){
  if(PUB.includes('XXXX'))return;
  const s=document.createElement('script');s.async=true;s.crossOrigin='anonymous';
  s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+PUB;document.head.appendChild(s);
  [['ad1',SLOT1,'auto'],['ad2',SLOT2,'auto']].forEach(([id,slot,fmt])=>{
    const el=$(id);el.innerHTML='<ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="'+PUB+'" data-ad-slot="'+slot+'" data-ad-format="'+fmt+'" data-full-width-responsive="true"></ins>';
    (window.adsbygoogle=window.adsbygoogle||[]).push({});
  });
}
let c=null;try{c=localStorage.getItem('consent')}catch(e){}
if(c==='yes')loadAds();else if(!c)$('consent').style.display='flex';
$('yes').onclick=()=>{try{localStorage.setItem('consent','yes')}catch(e){}$('consent').style.display='none';loadAds()};
$('no').onclick=()=>{try{localStorage.setItem('consent','no')}catch(e){}$('consent').style.display='none'};
</script>
<script data-goatcounter="https://speedcurrency.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
